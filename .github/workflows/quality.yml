name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction
      - name: Audit locked Composer dependencies
        run: composer audit --locked --format=summary
      - name: Lint Veylune PHP
        run: find custom/plugins/VeyluneTheme/src custom/plugins/VeyluneTheme/bin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install JavaScript quality dependencies
        run: npm ci
      - name: Run deterministic source checks
        run: npm run quality:fast
